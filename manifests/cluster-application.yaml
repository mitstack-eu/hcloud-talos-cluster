# The Argo CD Applications of the cluster repository: cluster/ holds the
# cluster's own manifests, and repository-credentials/ each app slice's
# repository Secret and Role, whose password the token renewal alone writes.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ printf "%q" .RepoURL }}
    targetRevision: HEAD
    path: cluster
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: repository-credentials
  namespace: argocd
spec:
  project: default
  source:
    repoURL: {{ printf "%q" .RepoURL }}
    targetRevision: HEAD
    path: repository-credentials
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: ""
      kind: Secret
      namespace: argocd
      jsonPointers:
        - /data/password
