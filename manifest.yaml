# hcloud-talos-cluster runs a three-node Talos Kubernetes cluster on Hetzner
# Cloud for one app, from talos-cluster-kit, with one control-plane node in
# each of fsn1, nbg1 and hel1. Subscribe creates a private network whose
# default route goes to a gateway, a firewall with no rule, and in fsn1, the
# gateway's location, a private load balancer for the Kubernetes API and a
# public one for ports 80 and 443 that both find every node by label, and a
# private cluster repository on GitHub. The gateway, the cluster's only
# server with a public address, forwards and records the nodes' traffic and
# serves their image mirror. A short-lived builder builds the cluster's own disk image with the
# machine configuration embedded, writes it to its disk and powers off, and
# that disk becomes the snapshot every node boots from with no user data.
#
# Every Hetzner resource carries the subscription id as a label and the
# repository carries it as a topic. Upgrade converges what is missing and
# never replaces a server. Unsubscribe deletes every server, load balancer,
# snapshot, firewall and network, and the repository, and finishes once the
# observers read every resource absent.
apiVersion: mitstack/v1beta
type: capability
metadata:
  id: hcloud-talos-cluster
  name: Hetzner Talos cluster
  owner: mitstack
spec:
  version: 0.11.4
  releaseClass: correctness-fix
  releaseNote: >-
    The block builds on talos-cluster-kit v0.19.1 in place of v0.12.0. Its
    node report gives each node's allocatable CPU, memory and pods, so an
    app's slice on the cluster is sized against its nodes instead of refused
    for want of a node report, and it lists the objects each Argo CD
    Application applied. The gateway answers no image request before its
    mirror is complete. A cluster built from an earlier release keeps its
    components until it is subscribed again.
  description: >
    Runs a three-node Talos Kubernetes cluster on Hetzner Cloud, a
    control-plane node in each of fsn1, nbg1 and hel1 behind an API and an
    ingress load balancer in fsn1, booted from its own image, with Argo CD
    syncing a repository it creates.
  lifecycle:
    endpoint: https://api.mitstack.dev/operators/hcloud-talos-cluster/hook
    operations: [subscribe, unsubscribe, upgrade, validate]
    contract: kit/v1
    # The image build and the gateway's mirror, the snapshot and the nodes' first boot take up to 75m.
    settleBudget: 90m
    verbConnections:
      validate: [hetzner, github]
      unsubscribe: [hetzner, github]
  resources:
    - hetzner.network
    - hetzner.firewall
    - name: api-load-balancer-fsn1
      type: hetzner.load-balancer
    - name: ingress-load-balancer-fsn1
      type: hetzner.load-balancer
    - name: github.repository
      type: github.gitops-repository
    - github.gitops-commit
    - name: gateway
      type: hetzner.server
    - name: node-fsn1
      type: hetzner.server
    - name: node-nbg1
      type: hetzner.server
    - name: node-hel1
      type: hetzner.server
    - hetzner.kubernetes-cluster
  provides:
    - hetzner.kubernetes-cluster
