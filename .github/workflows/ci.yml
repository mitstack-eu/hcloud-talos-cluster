# Block CI: the repository's one workflow.
#
# The block job makes one call to the operator kit's reusable publish-block
# workflow. That workflow runs conformance (go vet, go test and blockverify
# --standalone) on every event, and publishes the image to ECR together with
# its provenance record only on a push to main. The uses: ref pins a released
# kit tag, and kit-ref must equal it and the kit version go.mod requires. The
# kit decodes runs-on itself, so it is passed as a JSON string.
#
# The secrets job runs gitleaks over every commit HEAD reaches, on every
# event, because the kit's workflow scans for no secrets. The scripts job
# runs shellcheck over the scripts the block embeds.
#
# The tools image job builds talos-cluster-kit's tools image from the release
# go.mod requires. On a push to main it pushes the image to GitHub's registry
# and signs its digest keyless, and tools-image.txt pins that digest for the
# node report and the enrolment Jobs.
name: Block CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  block:
    uses: mitstack-eu/operator-kit/.github/workflows/publish-block.yml@v2.8.0
    with:
      block-id: hcloud-talos-cluster
      ecr-repository: mitstack-hcloud-talos-cluster
      kit-ref: v2.8.0
      go-version: "1.26.10"
      runs-on: ${{ vars.CI_RUNS_ON || '["ubicloud-standard-2"]' }}

  secrets:
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The history is small, so scanning all of it on every event stays cheap.
      - name: Cache the gitleaks binary
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: gitleaks
          key: gitleaks-8.21.2-${{ runner.os }}

      - name: Install gitleaks
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" \
            | tar -xz gitleaks

      - name: Verify the gitleaks binary
        run: |
          set -euo pipefail
          echo "50b742abd7daad8bbddb6301f3017efb680632d9a5b3b4d8f137b3aac250e359  gitleaks" | sha256sum -c -
          chmod +x gitleaks
          ./gitleaks version

      - name: Run gitleaks
        run: ./gitleaks git --no-banner --redact --log-opts=HEAD .

  scripts:
    permissions:
      contents: read
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck scripts/*.sh

  tools-image:
    name: tools image
    needs: [block]
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubicloud-standard-2"]') }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the talos-cluster-kit release go.mod requires
        run: |
          set -euo pipefail
          version=$(awk '{ for (i = 1; i < NF; i++) if ($i == "github.com/mitstack-eu/talos-cluster-kit") print $(i + 1) }' go.mod)
          git clone --quiet --depth 1 --branch "$version" https://github.com/mitstack-eu/talos-cluster-kit "$RUNNER_TEMP/talos-cluster-kit"
          echo "KIT_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the tools image
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: docker buildx build -f "$RUNNER_TEMP/talos-cluster-kit/tools/Dockerfile" "$RUNNER_TEMP/talos-cluster-kit/tools"

      - name: Install cosign v2.5.3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cosign" \
            https://github.com/sigstore/cosign/releases/download/v2.5.3/cosign-linux-amd64
          echo "783b5d6c74105401c63946c68d9b2a4e1aab3c8abce043e06b8510b02b623ec9  $RUNNER_TEMP/cosign" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/cosign"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The gateway copies the image into the cluster's mirror with no
      # credential, so the package must be public.
      - name: Build, push and sign the tools image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image=ghcr.io/mitstack-eu/hcloud-talos-cluster-tools
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --push -f "$RUNNER_TEMP/talos-cluster-kit/tools/Dockerfile" \
            --label "org.opencontainers.image.source=https://github.com/mitstack-eu/hcloud-talos-cluster" \
            -t "$image:$KIT_VERSION" --metadata-file "$RUNNER_TEMP/build.json" "$RUNNER_TEMP/talos-cluster-kit/tools"
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          cosign sign --yes "$image@$digest"
          echo "pin in tools-image.txt: $image:$KIT_VERSION@$digest"
